[project]
name = "geopositioning-and-navigation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "S4GC", email = "santiagoandresguamachungana@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "esda>=2.10.0",
    "fastparquet>=2026.9.0",
    "geoalchemy2>=0.20.0",
    "geopandas>=1.1.4",
    "ipykernel>=7.3.0",
    "libpysal>=4.15.0",
    "mapclassify>=2.11.0",
    "matplotlib>=3.11.2",
    "pandas>=3.0.5",
    "psycopg2-binary>=2.9.13",
    "pyarrow>=25.0.1",
    "pysal>=26.7",
    "s3fs>=2026.9.0",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
geopositioning-and-navigation = "geopositioning_and_navigation:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
